<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - Congresso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Montserrat', sans-serif; background-color: #F4F3EF; }</style>
</head>
<body class="h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md border-t-8 border-[#113C2B]">
        <div class="text-center mb-8">
            <i class="fas fa-lock text-4xl text-[#113C2B] mb-3"></i>
            <h2 class="text-2xl font-bold text-gray-800 uppercase tracking-widest">Acesso Restrito</h2>
            <p class="text-sm text-gray-500 mt-1">Insira suas credenciais para gerenciar a programação.</p>
        </div>

        <div id="msg-erro" class="hidden bg-red-100 border-l-4 border-red-600 text-red-700 p-3 rounded mb-6 text-sm font-semibold text-center"></div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Usuário</label>
                <input type="text" id="username" placeholder="Digite seu usuário" class="w-full border p-3 rounded bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#113C2B] transition">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha" class="w-full border p-3 rounded bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#113C2B] transition">
            </div>
            <button onclick="fazerLogin()" class="w-full bg-[#113C2B] text-white font-bold p-3 rounded hover:bg-green-900 shadow-md transition mt-4">
                ENTRAR NO PAINEL
            </button>
        </div>
    </div>

    <script>
        async function fazerLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const msgErro = document.getElementById('msg-erro');
            
            if(!user || !pass) {
                msgErro.innerText = "Preencha usuário e senha!";
                msgErro.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                
                const data = await res.json();
                
                if(res.ok) {
                    // Guarda a pulseira VIP na carteira (localStorage)
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('username', user);
                    
                    // Libera a passagem para o painel
                    window.location.href = '/index.html';
                } else {
                    msgErro.innerText = data.error;
                    msgErro.classList.remove('hidden');
                }
            } catch(e) {
                msgErro.innerText = "Erro ao conectar com o servidor.";
                msgErro.classList.remove('hidden');
            }
        }

        // Permite logar apertando "Enter"
        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') fazerLogin();
        });
    </script>
</body>
</html>
