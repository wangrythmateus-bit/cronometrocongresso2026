<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor do Orador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-image: url('fundo.png'); 
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            background-color: #f8f6f0; 
            font-family: 'Montserrat', sans-serif; 
            font-weight: 600;
        }
        .text-jw-green { color: #113C2B; }
        
        /* Sombras para leitura */
        .glow-texto { text-shadow: 0px 2px 10px rgba(255, 255, 255, 0.9), 0px 0px 5px rgba(255, 255, 255, 0.7); }
        .glow-timer { text-shadow: 0px 4px 15px rgba(255, 255, 255, 0.9); }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-4 md:p-8 2xl:p-12 relative overflow-hidden">

    <div class="text-center glow-texto flex-shrink-0 mt-2 2xl:mt-6">
        <h1 id="dsp-titulo" class="text-jw-green font-bold uppercase tracking-widest leading-none text-3xl md:text-5xl 2xl:text-7xl mb-1 2xl:mb-4">Felicidade Eterna</h1>
        <p id="dsp-subtitulo" class="text-jw-green uppercase tracking-wide leading-tight text-sm md:text-xl 2xl:text-3xl whitespace-pre-line">CONGRESSO 2026 - PIRAPORA / MG</p>
        <hr class="w-1/2 md:w-1/3 mx-auto border-[#113C2B] my-3 2xl:my-6 border-t-2 opacity-40">
    </div>

    <div class="flex-1 flex flex-col justify-center items-center glow-texto px-2">
        <p class="text-gray-600 uppercase tracking-widest text-xs md:text-sm 2xl:text-xl mb-1 2xl:mb-3">Tema do Discurso</p>
        
        <h2 id="tema" class="text-jw-green text-center leading-tight text-xl md:text-4xl 2xl:text-6xl px-2 md:px-10 2xl:px-20 max-w-full break-words">
            Aguardando início...
        </h2>

        <p class="text-gray-600 uppercase tracking-widest mt-4 md:mt-8 2xl:mt-12 text-xs md:text-sm 2xl:text-xl mb-1 2xl:mb-2">Orador</p>
        <h3 id="orador" class="text-gray-800 tracking-wide text-lg md:text-3xl 2xl:text-5xl">---</h3>

        <div id="relogio" class="text-jw-green leading-none glow-timer transition-colors duration-500 my-2 2xl:my-6 text-7xl md:text-9xl 2xl:text-[14rem]">
            00:00
        </div>

        <div class="w-11/12 md:w-2/3 mx-auto bg-white/70 backdrop-blur-sm rounded-full shadow-inner border border-gray-300 h-3 md:h-5 2xl:h-6 mt-2 2xl:mt-8">
            <div id="barra" class="bg-[#113C2B] h-full rounded-full transition-all duration-1000 ease-linear shadow-md" style="width: 100%"></div>
        </div>
    </div>

    <footer id="dsp-rodape" class="text-center text-jw-green uppercase tracking-widest opacity-80 glow-texto flex-shrink-0 mb-2 2xl:mb-6 text-[0.6rem] md:text-sm 2xl:text-lg">
        © 2026 Congresso das Testemunhas de Jeová
    </footer>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.on('sync_display', (data) => {
            if(data.tipo === 'config') {
                document.getElementById('dsp-titulo').innerText = data.titulo;
                document.getElementById('dsp-subtitulo').innerText = data.subtitulo;
                document.getElementById('dsp-rodape').innerText = data.rodape;
            } else {
                document.getElementById('tema').innerText = data.tema;
                document.getElementById('orador').innerText = data.orador;
                document.getElementById('relogio').innerText = data.tempoText;
                
                document.getElementById('relogio').style.color = data.cor;
                document.getElementById('barra').style.backgroundColor = data.cor;
                document.getElementById('barra').style.width = data.progresso + '%';
            }
        });
    </script>
</body>
</html>
